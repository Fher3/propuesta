<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd3de">
<title>Para Monchis 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:   #2f2b6b;      /* tinta azul de la carta */
    --red:   #d1213f;      /* pluma roja */
    --rose:  #f43f6e;
    --wine:  #8f1236;
    --cream: #fffdf7;
    --hand:  "Caveat", "Segoe Script", "Bradley Hand", cursive;
    --sans:  "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --lh: 34px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }

  /* ---------- Mantel de cuadros ---------- */
  body {
    font-family: var(--sans); color: var(--ink);
    background-color: #fff6f8;
    background-image:
      linear-gradient(90deg, rgba(240,100,140,.27) 50%, transparent 50%),
      linear-gradient(rgba(240,100,140,.27) 50%, transparent 50%);
    background-size: 76px 76px;
  }
  body::before {                       /* viñeta suave para dar profundidad */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% 42%, rgba(255,246,248,.6) 0%, rgba(255,246,248,0) 58%, rgba(170,30,80,.22) 100%);
  }

  #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  #floaters span { position: absolute; bottom: -60px; color: #ff7d9d; opacity: 0; animation: floatUp linear infinite; }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .45; }
    90%  { opacity: .35; }
    100% { transform: translateY(-115vh) rotate(40deg); opacity: 0; }
  }

  /* =====================================================
     INTRO: SOBRE DE CORREO AÉREO
     ===================================================== */
  #intro {
    position: fixed; inset: 0; z-index: 30; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    transition: visibility 0s 1.4s;
  }
  #intro.gone { visibility: hidden; pointer-events: none; }
  .scene {
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    transition: transform 1.2s cubic-bezier(.5,0,.3,1), opacity 1s ease;
  }
  #intro.leave .scene { transform: translateY(46vh) rotate(-7deg) scale(.82); opacity: 0; }

  .tag {
    font-family: var(--hand); font-weight: 700; font-size: clamp(24px, 3.4vw, 32px);
    color: var(--wine); background: #fffaf0; padding: 6px 20px 8px; border-radius: 6px;
    transform: rotate(2deg); box-shadow: 0 8px 18px rgba(143,18,54,.22);
    position: relative;
  }
  .tag::before, .tag::after { content: ""; position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #f2c0cc; box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
  .tag::before { left: 7px; } .tag::after { right: 7px; }

  .env {
    position: relative; width: min(450px, 86vw); aspect-ratio: 440 / 300;
    transform: rotate(-2deg); perspective: 1100px;
    filter: drop-shadow(0 26px 30px rgba(120,20,60,.38));
  }
  .env > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .env svg { display: block; overflow: visible; }

  .mini {
    left: 6%; top: 8%; width: 88%; height: 82%; z-index: 2; border-radius: 3px;
    background:
      repeating-linear-gradient(transparent 0 15px, rgba(70,120,190,.28) 15px 16px),
      var(--cream);
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    transition: transform .9s cubic-bezier(.25,.9,.3,1) 1s;
  }
  .front { z-index: 3; }
  .flap  { z-index: 5; transform-origin: 50% 0; transition: transform .75s ease .4s, z-index 0s .75s; }
  .env.open .flap { transform: rotateX(180deg); z-index: 1; }
  .env.open .mini { transform: translateY(-46%); }

  /* sello de cera (dos mitades que se rompen) */
  .seal {
    z-index: 6; left: 50%; top: 58%; width: 19%; height: auto; aspect-ratio: 1;
    transform: translate(-50%, -52%); cursor: pointer; border: 0; padding: 0; background: none;
  }
  .seal:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 50%; }
  .seal .half {
    position: absolute; inset: 0; transition: transform .7s cubic-bezier(.3,1.2,.5,1), opacity .6s ease;
    background: radial-gradient(circle at 35% 30%, #ff6a7e 0%, #c3162f 45%, #8c0b22 100%);
    border-radius: 52% 48% 55% 45% / 47% 55% 45% 53%;
    box-shadow: 0 6px 12px rgba(0,0,0,.35), inset 0 -4px 8px rgba(0,0,0,.25), inset 0 3px 6px rgba(255,255,255,.25);
    display: grid; place-items: center; color: #ffc7d0; font-size: clamp(18px, 4.6vw, 30px);
    text-shadow: 0 -1px 0 rgba(0,0,0,.3);
  }
  .seal .l { clip-path: polygon(0 0, 52% 0, 46% 22%, 54% 46%, 47% 72%, 52% 100%, 0 100%); }
  .seal .r { clip-path: polygon(52% 0, 100% 0, 100% 100%, 52% 100%, 47% 72%, 54% 46%, 46% 22%); }
  .env.open .seal .l { transform: translate(-30px, 26px) rotate(-26deg); opacity: 0; }
  .env.open .seal .r { transform: translate(30px, 30px) rotate(24deg);  opacity: 0; }

  #open {
    appearance: none; cursor: pointer; font: 800 19px var(--sans); color: #fff;
    padding: 14px 34px; border-radius: 999px; background: linear-gradient(180deg, #ff6a8e, #e11d52);
    border: 4px solid #fff; box-shadow: 0 0 0 1.5px rgba(179,18,63,.25), 0 10px 22px rgba(179,18,63,.35);
    transform: rotate(-2deg); transition: transform .15s ease, opacity .4s ease;
  }
  #open:hover { transform: rotate(-2deg) translateY(-3px); }
  #open:focus-visible { outline: 3px solid var(--wine); outline-offset: 3px; }
  #open.used { opacity: 0; pointer-events: none; }

  /* =====================================================
     LA CARTA (papel de cuaderno escrito a mano)
     ===================================================== */
  #stage {
    position: fixed; inset: 0; z-index: 35; padding: 34px 20px; overflow-y: auto; overflow-x: hidden;
    display: flex; pointer-events: none;
  }
  .letter {
    position: relative; margin: auto; pointer-events: auto;
    width: min(590px, 94vw); padding: 38px 28px 40px;
    background: var(--cream); border-radius: 6px; transform: rotate(-1deg);
    box-shadow: 0 2px 0 rgba(0,0,0,.04), 0 34px 60px rgba(120,30,60,.30), 0 8px 16px rgba(120,30,60,.16);
    animation: rise 1.4s cubic-bezier(.2,.85,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(72vh) rotate(6deg) scale(.5); }
    to   { opacity: 1; transform: translateY(0) rotate(-1deg) scale(1); }
  }
  .letter::before {                       /* margen rojo */
    content: ""; position: absolute; left: 70px; top: 0; bottom: 0; width: 2px; background: rgba(224,69,95,.5);
  }
  .letter::after {                        /* agujeros de argolla */
    content: ""; position: absolute; left: 16px; top: 0; bottom: 0; width: 24px; pointer-events: none;
    background: radial-gradient(circle at 12px 12px, #f6cdd8 0 8px, rgba(0,0,0,.14) 8.5px 10px, transparent 10.5px) 0 52px / 24px 150px repeat-y;
  }
  .folds {                                /* dobleces que desaparecen */
    position: absolute; inset: 0; pointer-events: none; border-radius: 6px; z-index: 4;
    background: linear-gradient(180deg, transparent 32.4%, rgba(60,30,30,.10) 33%, transparent 33.8%, transparent 65.4%, rgba(60,30,30,.10) 66%, transparent 66.8%);
    animation: unfold 2.6s ease 1s both;
  }
  @keyframes unfold { to { opacity: 0; } }

  .tape {
    position: absolute; width: 104px; height: 30px; z-index: 5;
    background: repeating-linear-gradient(45deg, rgba(255,150,178,.8) 0 9px, rgba(255,205,220,.8) 9px 18px);
    box-shadow: 0 2px 5px rgba(0,0,0,.14);
  }
  .tape.a { left: -34px; top: 14px; transform: rotate(-38deg); }
  .tape.b { right: -34px; top: 14px; transform: rotate(38deg); }

  .writing {
    position: relative; margin-left: 56px;
    font-family: var(--hand); font-weight: 500; font-size: 29px; line-height: var(--lh); color: var(--ink);
    background: repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px), rgba(70,120,190,.30) calc(var(--lh) - 1px) var(--lh));
    min-height: calc(var(--lh) * 7);
  }
  .ln { min-height: var(--lh); }
  .ln:first-of-type { font-size: 38px; font-weight: 700; color: var(--red); }
  .caret { display: inline-block; margin-left: 4px; font-size: 20px; color: var(--red); animation: blink .7s steps(2) infinite; vertical-align: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  .polaroid {
    float: right; width: 128px; margin: 2px -6px 8px 14px; padding: 8px 8px 24px; background: #fff;
    box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(5deg); shape-outside: margin-box;
  }
  .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }

  .doodles { position: absolute; left: -48px; top: 8px; width: 40px; pointer-events: none; }
  .doodles path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease 2.4s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* mascota tipo calcomanía */
  .mascot {
    position: absolute; right: -20px; bottom: -34px; width: 104px; z-index: 6; overflow: visible;
    transform: rotate(8deg); transform-origin: 50% 70%; animation: beat 1.7s ease-in-out infinite;
    filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 8px 8px rgba(0,0,0,.22));
  }
  @keyframes beat {
    0%,100% { transform: rotate(8deg) scale(1); } 14% { transform: rotate(8deg) scale(1.07); }
    28% { transform: rotate(8deg) scale(1); } 42% { transform: rotate(8deg) scale(1.05); }
  }
  .mascot [data-for] { display: none; }
  .mascot[data-mood="happy"] [data-for~="happy"],
  .mascot[data-mood="hope"]  [data-for~="hope"],
  .mascot[data-mood="sad"]   [data-for~="sad"],
  .mascot[data-mood="cry"]   [data-for~="cry"],
  .mascot[data-mood="yay"]   [data-for~="yay"] { display: inline; }
  .tear { transform-box: fill-box; transform-origin: center; animation: tear 1.4s ease-in infinite; }
  .tear.t2 { animation-delay: .6s; }
  @keyframes tear { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: .95; } 100% { transform: translateY(38px); opacity: 0; } }
  #eyes { transition: transform .12s ease-out; }

  /* ---------- Pregunta ---------- */
  #askBlock { position: relative; }
  #askBlock.in { animation: pop .6s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: none; } }
  .question {
    margin: 0; font-family: var(--hand); font-weight: 700; color: var(--red);
    font-size: clamp(38px, 7.4vw, 52px); line-height: calc(var(--lh) * 2); text-wrap: balance;
  }
  .scribble { display: block; width: min(330px, 80%); height: 14px; margin: -14px 0 8px; overflow: visible; }
  .scribble path { fill: none; stroke: var(--red); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #askBlock.in .scribble path { animation: draw 1s ease .5s forwards; }

  .row { display: flex; align-items: center; min-height: calc(var(--lh) * 3); }
  #yes {
    --n: 0;
    position: relative; z-index: 3; cursor: pointer; color: #fff; white-space: nowrap;
    font: 800 min(calc(1.2rem + var(--n) * .55rem), 17vw) var(--sans);
    padding: .5em 1.25em; border-radius: 999px;
    background: linear-gradient(180deg, #ff6a8e, #e11d52);
    border: 4px solid #fff;
    box-shadow: 0 0 0 1.5px rgba(179,18,63,.28), 0 .3em 0 rgba(143,18,54,.35), 0 .7em 1.2em rgba(225,29,82,.35);
    transform: rotate(-2deg);
    transition: font-size .35s cubic-bezier(.3,1.5,.5,1), transform .12s ease;
  }
  #yes:hover  { transform: rotate(-2deg) translateY(-3px); }
  #yes:active { transform: rotate(-2deg) translateY(2px); }
  #yes:focus-visible { outline: 3px solid var(--wine); outline-offset: 4px; }

  #noSlot { display: block; height: 1px; margin-left: 20px; transition: width .4s ease, margin .4s ease; }
  #no {
    position: fixed; z-index: 70; left: 0; top: 0; cursor: pointer; white-space: nowrap;
    font: 800 17px var(--sans); color: #a0516a; padding: 11px 22px; border-radius: 999px;
    background: #fff; border: 3px solid #fff; box-shadow: 0 0 0 1.5px rgba(179,18,63,.2), 0 6px 14px rgba(179,18,63,.16);
    transform: rotate(2.5deg); user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #no.moving { transition: left .28s cubic-bezier(.3,1.3,.5,1), top .28s cubic-bezier(.3,1.3,.5,1); }

  .hint { min-height: var(--lh); margin: 6px 0 0; font-family: var(--hand); font-weight: 700; font-size: 27px; color: var(--rose); }
  .hint.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(.9); opacity: .2; } 60% { transform: scale(1.06); } 100% { transform: none; opacity: 1; } }

  /* ---------- Respuesta ---------- */
  #yayBlock { position: relative; }
  #yayBlock h2 { margin: 0; font-family: var(--hand); font-weight: 700; font-size: clamp(44px, 9vw, 62px); line-height: calc(var(--lh) * 2); color: var(--red); }
  #yayBlock p { margin: 0 0 var(--lh); }
  .date { display: inline-block; font-weight: 700; color: var(--wine); }
  .stamp {
    position: absolute; right: 4px; top: -6px; padding: 4px 18px 8px; border: 5px solid var(--red); border-radius: 12px;
    font: 800 38px/1.1 var(--sans); color: var(--red); text-align: center; transform: rotate(-12deg); opacity: .9;
    mix-blend-mode: multiply; animation: thunk .5s cubic-bezier(.2,1.6,.4,1) .15s both;
  }
  .stamp small { display: block; font: 700 14px var(--sans); letter-spacing: .02em; }
  @keyframes thunk { from { opacity: 0; transform: rotate(-12deg) scale(3); } to { opacity: .9; transform: rotate(-12deg) scale(1); } }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

  #mute {
    position: fixed; z-index: 80; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top));
    width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: #ff6a8e; color: #fff;
    font-size: 18px; cursor: pointer; box-shadow: 0 6px 14px rgba(179,18,63,.3);
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  body.started #mute { opacity: 1; pointer-events: auto; }
  #mute:focus-visible { outline: 3px solid var(--wine); outline-offset: 2px; }

  @media (max-width: 520px) {
    :root { --lh: 32px; }
    .letter { padding: 34px 18px 38px 14px; }
    .letter::before { left: 56px; }
    .writing { margin-left: 46px; font-size: 25px; }
    .ln:first-of-type { font-size: 32px; }
    .polaroid { width: 96px; }
    .mascot { width: 82px; right: -8px; }
    .stamp { font-size: 28px; }
    .doodles { display: none; }
    .tape.a { left: -22px; } .tape.b { right: -22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #floaters { display: none; }
    .letter, .mascot, .tear, .folds, .stamp { animation: none; }
    .doodles path, #askBlock.in .scribble path { animation: none; stroke-dashoffset: 0; }
    .flap, .mini, .seal .half, .scene { transition-duration: .01s; }
  }
</style>
</head>
<body>

<div id="floaters" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<button id="mute" aria-label="Pausar o reanudar la música" title="Música">♪</button>

<!-- ================= SOBRE ================= -->
<section id="intro">
  <div class="scene">
    <div class="tag">Tienes una carta 💌</div>

    <div class="env" id="env">
      <!-- fondo -->
      <svg class="back" viewBox="0 0 440 300" aria-hidden="true">
        <defs>
          <pattern id="air" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="22" height="22" fill="#fdf3e3"/>
            <rect width="7" height="22" fill="#e0455f"/>
            <rect x="11" width="7" height="22" fill="#3d6fb5"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="440" height="300" rx="6" fill="#ecd9bd"/>
        <rect x="6" y="6" width="428" height="288" rx="3" fill="#fbeedd" stroke="url(#air)" stroke-width="12"/>
      </svg>

      <div class="mini" aria-hidden="true"></div>

      <!-- frente del sobre -->
      <svg class="front" viewBox="0 0 440 300" aria-hidden="true">
        <polygon points="0,300 0,0 220,168 440,0 440,300" fill="#fdf3e3"/>
        <path d="M6 6 V294 H434 V6" fill="none" stroke="url(#air)" stroke-width="12"/>
        <path d="M6 6 L220 168 L434 6" fill="none" stroke="#e9d3b2" stroke-width="1.5"/>

        <text x="62" y="214" font-family="Caveat, cursive" font-size="24" fill="#a07282" font-weight="500">Para:</text>
        <text x="112" y="228" font-family="Caveat, cursive" font-size="58" fill="#b3123f" font-weight="700" id="envName">Monchis</text>
        <path d="M62 238 H318" stroke="#d9b9a7" stroke-width="1.5"/>
        <text x="62" y="272" font-family="Caveat, cursive" font-size="22" fill="#a07282" font-weight="500">De: alguien que te quiere mucho</text>

        <!-- estampilla -->
        <rect x="352" y="198" width="56" height="68" fill="#f9d2dc" stroke="#fdf3e3" stroke-width="7" stroke-dasharray="3 5"/>
        <rect x="358" y="204" width="44" height="56" fill="none" stroke="#e0455f" stroke-width="1.5"/>
        <text x="380" y="240" font-size="26" fill="#d1213f" text-anchor="middle">♥</text>
        <text x="380" y="256" font-size="8" fill="#b3123f" text-anchor="middle" font-weight="800" font-family="Nunito, sans-serif">AMOR</text>
        <!-- matasellos -->
        <g fill="none" stroke="rgba(61,111,181,.55)" stroke-width="2">
          <circle cx="344" cy="228" r="24"/>
          <path d="M300 218 q9 -7 18 0 t18 0 M300 230 q9 -7 18 0 t18 0 M300 242 q9 -7 18 0 t18 0" transform="translate(-6 0)"/>
        </g>
      </svg>

      <!-- solapa -->
      <svg class="flap" viewBox="0 0 440 300" aria-hidden="true">
        <polygon points="0,0 440,0 220,176" fill="#f7e6cc"/>
        <path d="M6 6 H434" stroke="url(#air)" stroke-width="12" fill="none"/>
        <path d="M6 6 L220 170 L434 6" fill="none" stroke="url(#air)" stroke-width="7" stroke-linejoin="round"/>
      </svg>

      <button class="seal" id="seal" aria-label="Romper el sello y abrir la carta">
        <span class="half l">♥</span><span class="half r">♥</span>
      </button>
    </div>
  </div>
  <button id="open" style="position:relative;z-index:2">Abrir carta</button>
</section>

<!-- ================= CARTA ================= -->
<main id="stage" hidden>
  <div class="letter" id="letter">
    <span class="tape a"></span><span class="tape b"></span>
    <div class="folds"></div>

    <svg class="mascot" id="mascot" data-mood="happy" viewBox="0 0 200 190" role="img" aria-label="Un corazón con carita">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff86a4"/><stop offset="1" stop-color="#f0275e"/>
        </linearGradient>
      </defs>
      <path d="M100 176 C30 122 6 86 6 56 C6 28 29 8 55 8 C75 8 92 20 100 40 C108 20 125 8 145 8 C171 8 194 28 194 56 C194 86 170 122 100 176Z" fill="url(#hg)"/>
      <ellipse cx="55" cy="40" rx="20" ry="11" fill="#fff" opacity=".38" transform="rotate(-28 55 40)"/>
      <ellipse cx="52" cy="104" rx="13" ry="7.5" fill="#ff2d5b" opacity=".35"/>
      <ellipse cx="148" cy="104" rx="13" ry="7.5" fill="#ff2d5b" opacity=".35"/>
      <g id="eyes" data-for="happy hope sad cry">
        <circle cx="72" cy="82" r="10" fill="#3a0a1a"/><circle cx="76" cy="78" r="3.4" fill="#fff"/>
        <circle cx="128" cy="82" r="10" fill="#3a0a1a"/><circle cx="132" cy="78" r="3.4" fill="#fff"/>
      </g>
      <g data-for="sad cry" stroke="#3a0a1a" stroke-width="4" stroke-linecap="round">
        <path d="M54 68 L84 58"/><path d="M146 68 L116 58"/>
      </g>
      <g data-for="yay" fill="#fff" font-size="30" text-anchor="middle">
        <text x="72" y="92">♥</text><text x="128" y="92">♥</text>
      </g>
      <path data-for="happy" d="M84 104 Q100 120 116 104" fill="none" stroke="#3a0a1a" stroke-width="4.5" stroke-linecap="round"/>
      <path data-for="hope"  d="M92 106 Q100 116 108 106 Q100 100 92 106Z" fill="#3a0a1a"/>
      <path data-for="sad"   d="M86 116 Q100 102 114 116" fill="none" stroke="#3a0a1a" stroke-width="4.5" stroke-linecap="round"/>
      <path data-for="cry"   d="M84 118 Q100 98 116 118 Q100 110 84 118Z" fill="#3a0a1a"/>
      <g data-for="yay">
        <path d="M80 100 Q100 134 120 100Z" fill="#7a0f2b"/>
        <ellipse cx="100" cy="116" rx="9" ry="5" fill="#ff7b95"/>
      </g>
      <path class="tear"    data-for="cry" d="M64 94 C57 106 57 114 64 114 C71 114 71 106 64 94Z" fill="#7fd0ff"/>
      <path class="tear t2" data-for="cry" d="M136 94 C129 106 129 114 136 114 C143 114 143 106 136 94Z" fill="#7fd0ff"/>
      <g data-for="yay" fill="#ffd166" font-size="22" text-anchor="middle">
        <text x="14" y="30">✦</text><text x="190" y="44">✦</text><text x="178" y="12" font-size="14">✦</text>
      </g>
    </svg>

    <div class="writing" id="writing">
      <svg class="doodles" viewBox="0 0 50 130" aria-hidden="true">
        <path pathLength="1" stroke="#d1213f" stroke-width="2.4" d="M25 42 C8 30 4 20 8 13 C12 6 22 8 25 15 C28 8 38 6 42 13 C46 20 42 30 25 42Z"/>
        <path pathLength="1" stroke="#f0a020" stroke-width="2.2" d="M24 70 L29 82 L42 83 L32 92 L35 105 L24 98 L13 105 L16 92 L6 83 L19 82 Z"/>
      </svg>

      <figure class="polaroid" id="polaroid" hidden>
        <img id="photo" src="foto.jpg" alt="Foto">
      </figure>

      <!-- Pregunta -->
      <div id="askBlock" hidden>
        <h1 class="question" id="question">¿Quieres que seamos novios?</h1>
        <svg class="scribble" viewBox="0 0 340 14" preserveAspectRatio="none" aria-hidden="true">
          <path pathLength="1" d="M3 8 C 50 1, 100 13, 160 6 S 280 11, 337 4"/>
        </svg>
        <div class="row">
          <button id="yes" type="button">Sí 💖</button>
          <span id="noSlot"></span>
        </div>
        <p class="hint" id="hint" aria-live="polite"></p>
      </div>

      <!-- Respuesta -->
      <div id="yayBlock" hidden>
        <div class="stamp">¡SÍ!<small>con todo mi corazón</small></div>
        <h2>¡Dijiste que sí!</h2>
        <p id="finalMsg"></p>
        <span class="date" id="dateLine"></span>
      </div>
    </div>
  </div>
</main>

<button id="no" type="button" hidden aria-label="No">Nou</button>

<audio id="song" src="amor.mp3" loop preload="auto"></audio>

<script>
/* ===================== TEXTOS (edítalos a tu gusto) ===================== */
const CONFIG = {
  nombre: "Monchis",
  // Cada elemento es una línea que se va escribiendo a mano
  carta: [
    "Monchis,",
    "no sé en qué momento pasó, pero contigo todo se siente más bonito.",
    "Me encanta cómo me haces reír, cómo me escuchas y cómo haces especial hasta lo más simple.",
    "Hoy me armé de valor para preguntarte algo que llevo tiempo queriendo decirte…",
  ],
  pregunta: "¿Quieres que seamos novios?",
  mensajeFinal: "Hoy me hiciste la persona más feliz del mundo. Prometo que haré las cosas bien, hacerte reír y quererte cada día más.",
};

// Frases que aparecen cada vez que intenta darle a "No"
const HINTS = [
  "",
  "¿De verdad? 🥺",
  "Mmm… ese botón parece estar nervioso jasjkaksj.",
  "Mira que te quiero mucho 💗",
  "Dale una oportunidad al botón de Sí, andaa",
  "Ándale di que siii…",
  "El botón de Sí se ve cada vez más lindo, ¿no?",
  "Ya casi lloro, eh 😭",
  "Prometo cuidarte muchísimo.",
  "No hay forma de decir que no, ríndeteeee",
  "Solo existe una respuesta posible 💖",
];

/* ===================== ELEMENTOS ===================== */
const $ = id => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const song = $("song"), intro = $("intro"), env = $("env"), openBtn = $("open"), seal = $("seal");
const stage = $("stage"), letter = $("letter"), writing = $("writing"), mascot = $("mascot"), eyes = $("eyes");
const askBlock = $("askBlock"), yayBlock = $("yayBlock");
const yesBtn = $("yes"), noBtn = $("no"), noSlot = $("noSlot"), hint = $("hint"), muteBtn = $("mute");

$("envName").textContent = CONFIG.nombre;
$("question").textContent = CONFIG.pregunta;
$("finalMsg").textContent = CONFIG.mensajeFinal;
$("dateLine").textContent = "Desde hoy, " +
  new Date().toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }) + ", somos novios 💞";

// Foto opcional: si subes "foto.jpg" junto al index.html, aparece pegada en la carta
const photo = $("photo");
photo.addEventListener("load", () => { $("polaroid").hidden = false; });

/* ===================== CORAZONES DE FONDO ===================== */
(function () {
  const box = $("floaters");
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span");
    s.textContent = "♥";
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = (14 + Math.random() * 28) + "px";
    s.style.animationDuration = (14 + Math.random() * 14) + "s";
    s.style.animationDelay = (-Math.random() * 24) + "s";
    box.appendChild(s);
  }
})();

/* ===================== ESTADO ===================== */
let attempts = 0, dodged = false, askShown = false, answered = false, armed = false, lastDodge = 0;
const noPos = { x: 0, y: 0, w: 0, h: 0 };

function setMood(m) { mascot.setAttribute("data-mood", m); }
function moodFor(n) { return n < 2 ? "happy" : n < 4 ? "hope" : n < 8 ? "sad" : "cry"; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ===================== SOBRE → CARTA ===================== */
let opened = false;
function openEnvelope() {
  if (opened) return; opened = true;
  openBtn.classList.add("used");
  document.body.classList.add("started");
  song.volume = 0.85;
  song.play().catch(() => {});           // si el navegador la bloquea, el botón ♪ la activa
  env.classList.add("open");

  setTimeout(() => { stage.hidden = false; intro.classList.add("leave"); }, 1700);
  setTimeout(() => { intro.classList.add("gone"); typeLetter(); }, 3000);
}
openBtn.addEventListener("click", openEnvelope);
seal.addEventListener("click", openEnvelope);

muteBtn.addEventListener("click", () => {
  if (song.paused) { song.play(); muteBtn.textContent = "♪"; }
  else { song.pause(); muteBtn.textContent = "✕"; }
});

/* ===================== LA CARTA SE ESCRIBE SOLA ===================== */
let skipping = false;
letter.addEventListener("click", () => { skipping = true; });   // tocar la carta acelera la escritura

async function typeLetter() {
  const caret = document.createElement("span");
  caret.className = "caret"; caret.textContent = "♥";
  const fast = () => skipping || REDUCED;

  for (const line of CONFIG.carta) {
    const div = document.createElement("div");
    div.className = "ln";
    const txt = document.createTextNode("");
    div.appendChild(txt); div.appendChild(caret);
    writing.insertBefore(div, askBlock);

    for (const ch of line) {
      txt.nodeValue += ch;
      if (!fast()) await sleep(",.…".includes(ch) ? 170 : 26 + Math.random() * 26);
    }
    if (!fast()) await sleep(420);
  }
  caret.remove();
  if (!fast()) await sleep(350);
  revealAsk();
}

function revealAsk() {
  askBlock.hidden = false;
  askBlock.classList.add("in");
  noBtn.hidden = false;
  askShown = true;
  sizeNo();
  placeNoAtSlot();                         // aparece justo al lado del Sí
}

/* ===================== BOTÓN "NO": HUYE DEL MOUSE ===================== */
function sizeNo() {
  noPos.w = noBtn.offsetWidth; noPos.h = noBtn.offsetHeight;
  noSlot.style.width = noPos.w + "px";
  noSlot.style.height = noPos.h + "px";
}
function placeNoAtSlot() {
  const r = noSlot.getBoundingClientRect();
  noPos.x = r.left; noPos.y = r.top;
  noBtn.style.left = noPos.x + "px";
  noBtn.style.top  = noPos.y + "px";
}
(function loop() {
  if (askShown && !dodged && !answered) placeNoAtSlot();   // mientras no se mueva, se queda pegado a su hueco
  requestAnimationFrame(loop);
})();

function overlapsYes(x, y) {
  const r = yesBtn.getBoundingClientRect(), pad = 24;
  return !(x + noPos.w < r.left - pad || x > r.right + pad ||
           y + noPos.h < r.top - pad  || y > r.bottom + pad);
}

function dodge(px, py, countIt) {
  if (answered) return;
  if (!dodged) {
    dodged = true;
    noBtn.classList.add("moving");
    noSlot.style.width = "0px"; noSlot.style.marginLeft = "0px";   // el Sí queda centrado
  }
  const ox = noPos.x + noPos.w / 2, oy = noPos.y + noPos.h / 2;
  if (px == null) { px = ox; py = oy; }

  const m = 24, minX = m, minY = m, maxX = innerWidth - noPos.w - m, maxY = innerHeight - noPos.h - m;
  let best = null;

  // salta cerca (no a las orillas): 170–360 px desde donde estaba
  for (let i = 0; i < 80 && !best; i++) {
    const ang = Math.random() * Math.PI * 2, dist = 170 + Math.random() * 190;
    let x = ox + Math.cos(ang) * dist - noPos.w / 2;
    let y = oy + Math.sin(ang) * dist - noPos.h / 2;
    x = Math.min(Math.max(x, minX), maxX); y = Math.min(Math.max(y, minY), maxY);
    if (overlapsYes(x, y)) continue;
    if (Math.hypot(x + noPos.w / 2 - px, y + noPos.h / 2 - py) < 200) continue;
    best = { x, y };
  }
  if (!best) {                              // pantallas chicas: el punto más lejano del cursor
    let bd = -1;
    for (let i = 0; i < 60; i++) {
      const x = minX + Math.random() * Math.max(1, maxX - minX);
      const y = minY + Math.random() * Math.max(1, maxY - minY);
      if (overlapsYes(x, y)) continue;
      const d = Math.hypot(x + noPos.w / 2 - px, y + noPos.h / 2 - py);
      if (d > bd) { bd = d; best = { x, y }; }
    }
  }
  if (!best) best = { x: px < innerWidth / 2 ? maxX : minX, y: py < innerHeight / 2 ? maxY : minY };

  noPos.x = best.x; noPos.y = best.y;
  noBtn.style.left = best.x + "px";
  noBtn.style.top  = best.y + "px";
  if (countIt) registerAttempt();
}

function registerAttempt() {
  attempts++;
  yesBtn.style.setProperty("--n", Math.min(attempts, 16));      // el Sí crece
  setMood(moodFor(attempts));
  hint.textContent = HINTS[Math.min(attempts, HINTS.length - 1)];
  hint.classList.remove("bump"); void hint.offsetWidth; hint.classList.add("bump");
}

function distToNo(px, py) {
  const dx = Math.max(noPos.x - px, 0, px - (noPos.x + noPos.w));
  const dy = Math.max(noPos.y - py, 0, py - (noPos.y + noPos.h));
  return Math.hypot(dx, dy);
}

document.addEventListener("pointermove", e => {
  // los ojos del corazón siguen al cursor
  const r = mascot.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height * 0.45;
  const ang = Math.atan2(e.clientY - cy, e.clientX - cx);
  const mag = Math.min(1, Math.hypot(e.clientX - cx, e.clientY - cy) / 300);
  eyes.style.transform = `translate(${Math.cos(ang) * 5 * mag}px, ${Math.sin(ang) * 4 * mag}px)`;

  if (!askShown || answered || e.pointerType === "touch") return;
  const d = distToNo(e.clientX, e.clientY);
  if (!armed) { if (d > 140) armed = true; return; }   // primero deja que se vea junto al Sí
  if (d < 90) {                                        // se aparta antes de que lo toques
    const now = performance.now();
    if (now - lastDodge > 240) { lastDodge = now; dodge(e.clientX, e.clientY, true); }
  }
});

// si logran hacer clic / tocar / usar teclado, igual se escapa
function blockNo(e) {
  e.preventDefault(); e.stopPropagation();
  const now = performance.now();
  const count = now - lastDodge > 240;
  if (count) lastDodge = now;
  dodge(e.clientX, e.clientY, count);
}
noBtn.addEventListener("pointerdown", blockNo);
noBtn.addEventListener("click", blockNo);
noBtn.addEventListener("focus", () => { noBtn.blur(); dodge(null, null, true); });
noBtn.addEventListener("keydown", e => { e.preventDefault(); dodge(null, null, true); });

addEventListener("resize", () => {
  if (!dodged) return;
  noPos.x = Math.max(24, Math.min(noPos.x, innerWidth - noPos.w - 24));
  noPos.y = Math.max(24, Math.min(noPos.y, innerHeight - noPos.h - 24));
  noBtn.style.left = noPos.x + "px";
  noBtn.style.top  = noPos.y + "px";
});

/* ===================== ¡SÍ! ===================== */
yesBtn.addEventListener("click", () => {
  answered = true;
  noBtn.hidden = true;
  askBlock.hidden = true;
  yayBlock.hidden = false;
  setMood("yay");
  song.volume = 1;
  startConfetti();
});

/* ===================== CONFETI DE CORAZONES ===================== */
const cv = $("confetti"), c2 = cv.getContext("2d");
let parts = [], rainUntil = 0, confettiOn = false;
const COLORS = ["#ff4d78", "#ff7a9a", "#ffc2cf", "#ffffff", "#ffd166", "#e11d52", "#ff9eb5"];
const GLYPHS = ["♥", "♥", "♥", "✦", "❤"];

function fitCanvas() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fitCanvas); fitCanvas();

function addPart(x, y, vx, vy) {
  parts.push({
    x, y, vx, vy, size: 14 + Math.random() * 26, rot: Math.random() * 6.28,
    vr: (Math.random() - .5) * .15, color: COLORS[Math.floor(Math.random() * COLORS.length)],
    glyph: GLYPHS[Math.floor(Math.random() * GLYPHS.length)], sway: Math.random() * 6.28
  });
}
function startConfetti() {
  rainUntil = performance.now() + 9000;
  for (let i = 0; i < 70; i++) {
    addPart(0, innerHeight, 4 + Math.random() * 9, -(10 + Math.random() * 14));
    addPart(innerWidth, innerHeight, -(4 + Math.random() * 9), -(10 + Math.random() * 14));
  }
  if (!confettiOn) { confettiOn = true; requestAnimationFrame(confettiLoop); }
}
function confettiLoop(now) {
  c2.clearRect(0, 0, innerWidth, innerHeight);
  if (now < rainUntil && Math.random() < .8) addPart(Math.random() * innerWidth, -30, (Math.random() - .5) * 2, 1 + Math.random() * 2);
  parts = parts.filter(p => p.y < innerHeight + 50);
  const fam = getComputedStyle(document.body).fontFamily;
  for (const p of parts) {
    p.vy += 0.17; p.vx *= 0.992; p.vy *= 0.992; p.sway += .05;
    p.x += p.vx + Math.sin(p.sway) * .6; p.y += p.vy; p.rot += p.vr;
    c2.save(); c2.translate(p.x, p.y); c2.rotate(p.rot);
    c2.fillStyle = p.color; c2.font = `${p.size}px ${fam}`;
    c2.textAlign = "center"; c2.textBaseline = "middle";
    c2.fillText(p.glyph, 0, 0);
    c2.restore();
  }
  if (parts.length || now < rainUntil) requestAnimationFrame(confettiLoop);
  else confettiOn = false;
}
</script>
</body>
</html>
